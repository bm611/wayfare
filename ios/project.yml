name: Wayfare
options:
  bundleIdPrefix: com.wayfare
  deploymentTarget:
    iOS: "17.0"
packages:
  WayfareCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wayfare:
    type: application
    platform: iOS
    sources: [Wayfare]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: WayfareCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wayfare.app.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Wayfare.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
schemes:
  Wayfare:
    build:
      targets:
        Wayfare: all
